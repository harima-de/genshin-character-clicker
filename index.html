<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#11182a"><title>티바트 클리커 V1</title>
<style>
:root{--bg:#0b1120;--panel:#172238;--panel2:#202e49;--text:#f5f1e8;--muted:#aeb9ce;--gold:#f6c96d;--purple:#bda4fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 30% 0%,#273454,transparent 45%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:1100px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:clamp(23px,4vw,35px);font-weight:900}.sub,.muted{color:var(--muted);font-size:13px}.resources{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#26334d;padding:9px 13px;border-radius:99px}.layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:14px;margin-top:16px}.panel{background:linear-gradient(150deg,#1a2841,#101a2d);border:1px solid #ffffff18;border-radius:23px;padding:20px;box-shadow:0 18px 38px #0003}.main{text-align:center}.eyebrow{letter-spacing:3px;color:var(--gold);font-size:12px}.orb{display:grid;place-items:center;width:min(235px,65vw);height:min(235px,65vw);margin:18px auto;border-radius:50%;border:3px solid #c6b5fa;box-shadow:0 0 60px #a18aff55,inset 0 0 40px #8873dc55;background:radial-gradient(circle at 35% 30%,#a2a8e7,#59448e 58%,#202341);font-size:100px;transition:transform .09s}.orb:active{transform:scale(.94)}.bar{height:14px;border-radius:20px;background:#090f1d;overflow:hidden;margin:15px 0 6px}.fill{height:100%;background:linear-gradient(90deg,#8d8af7,#f6c96d);width:0}.buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0}.btn{background:#334665;border:1px solid #ffffff22;color:white;padding:11px 15px;border-radius:13px;font-weight:750}.primary{background:linear-gradient(125deg,#eac073,#b9893e);color:#231a12}.side{display:grid;gap:14px;align-content:start}h2{margin:0 0 13px;font-size:20px}.statline{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}.result{min-height:155px;padding:16px;background:#ffffff09;border-radius:18px;display:grid;place-items:center;margin-top:12px}.result strong{font-size:25px}.five{color:var(--gold)}.four{color:var(--purple)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tab.active{background:#7762b3}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:370px;overflow:auto}.char{padding:12px;border-radius:12px;background:#ffffff0b;border:1px solid #ffffff13}.char.locked{opacity:.42}.char .stars{font-size:12px;color:var(--gold)}.shoprow{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid #ffffff19;padding:12px 0}.shoprow:first-child{border-top:0}.shoprow .btn{font-size:12px}.foot{font-size:12px;color:var(--muted);margin:18px 0;text-align:center}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#354464;padding:11px 17px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}.toast.show{opacity:1}@media(max-width:750px){.layout{grid-template-columns:1fr}.app{padding:11px}.panel{padding:15px}.orb{font-size:84px}.list{max-height:340px}.brand{font-size:25px}}
</style></head><body><div class="app">
<header class="top"><div><div class="brand">✦ 티바트 클리커</div><div class="sub">비공식 팬메이드 · V1</div></div><div class="resources"><span class="pill">💎 원석 <b id="gems">0</b></span><span class="pill">🌠 인연 <b id="fates">0</b></span></div></header>
<div class="layout"><section class="panel main"><div class="eyebrow">CHARACTER EVENT WISH</div><h1>별의 부름</h1><p class="muted">클릭으로 에너지를 모아 원석을 획득하세요.</p><button class="orb" id="tap" aria-label="기원 에너지 클릭">✦</button><div class="statline"><span>에너지 <b id="energy">0</b>/100</span><span>클릭당 +<b id="power">1</b></span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="sub">에너지 100마다 원석 160개 획득</div><div class="buttons"><button class="btn" id="exchange">💎 160 → 🌠 1</button><button class="btn primary" id="wish1">기원 1회</button><button class="btn primary" id="wish10">기원 10회</button></div><div class="statline"><span>5성 천장: <b id="pity5">0</b>/90</span><span>4성 천장: <b id="pity4">0</b>/10</span><span id="guarantee">픽업 50:50</span></div><div class="result" id="result"><div>✨ 기원을 시작해 보세요!</div></div></section>
<div class="side"><section class="panel"><h2>📖 캐릭터 도감 <small id="dexcount" class="muted"></small></h2><div class="tabs" id="filters"><button class="btn tab active" data-filter="all">전체</button><button class="btn tab" data-filter="5">5성</button><button class="btn tab" data-filter="4">4성</button><button class="btn tab" data-filter="owned">획득</button></div><div class="list" id="dex"></div></section>
<section class="panel"><h2>🛒 상점 · 성장</h2><div id="shop"></div><h2>🏆 기록</h2><div class="statline"><span>총 기원 <b id="total">0</b>회</span><span>5성 획득 <b id="fivecount">0</b>회</span></div><div class="buttons"><button class="btn" id="export">저장 내보내기</button><button class="btn" id="import">저장 가져오기</button><input type="file" id="file" accept="application/json" hidden></div></section></div></div>
<div class="foot">원신 공식 게임과 무관한 비공식 팬메이드 프로젝트입니다. V1은 텍스트 도감 및 단순화된 기원 규칙을 사용합니다.</div></div><div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';
const KEY='genshinClickerV1', VERSION=1;
const characters=[
{id:'furina',name:'푸리나',stars:5,element:'물',region:'폰타인',featured:true},
{id:'nahida',name:'나히다',stars:5,element:'풀',region:'수메르'},
{id:'raiden',name:'라이덴 쇼군',stars:5,element:'번개',region:'이나즈마'},
{id:'jean',name:'진',stars:5,element:'바람',region:'몬드'},
{id:'diluc',name:'다이루크',stars:5,element:'불',region:'몬드'},
{id:'keqing',name:'각청',stars:5,element:'번개',region:'리월'},
{id:'mona',name:'모나',stars:5,element:'물',region:'몬드'},
{id:'qiqi',name:'치치',stars:5,element:'얼음',region:'리월'},
{id:'bennett',name:'베넷',stars:4,element:'불',region:'몬드'},
{id:'xiangling',name:'향릉',stars:4,element:'불',region:'리월'},
{id:'xingqiu',name:'행추',stars:4,element:'물',region:'리월'},
{id:'fischl',name:'피슬',stars:4,element:'번개',region:'몬드'},
{id:'sucrose',name:'설탕',stars:4,element:'바람',region:'몬드'},
{id:'noelle',name:'노엘',stars:4,element:'바위',region:'몬드'},
{id:'barbara',name:'바바라',stars:4,element:'물',region:'몬드'},
{id:'kuki',name:'쿠키 시노부',stars:4,element:'번개',region:'이나즈마'}];
const fresh=()=>({version:VERSION,gems:0,fates:3,energy:0,power:1,upgrade:0,pity5:0,pity4:0,guaranteed:false,total:0,collection:{},history:[]});
let state=fresh(),filter='all';const $=id=>document.getElementById(id);
function clamp(n,min,max){return Number.isFinite(n)?Math.min(max,Math.max(min,Math.floor(n))):min}
function load(){try{const raw=JSON.parse(localStorage.getItem(KEY));if(!raw||raw.version!==VERSION)return;state={...fresh(),...raw};for(const k of ['gems','fates','energy','power','upgrade','pity5','pity4','total'])state[k]=clamp(Number(state[k]),0,1000000000);state.pity5=clamp(state.pity5,0,89);state.pity4=clamp(state.pity4,0,9);state.guaranteed=Boolean(state.guaranteed);if(!state.collection||typeof state.collection!=='object'||Array.isArray(state.collection))state.collection={};if(!Array.isArray(state.history))state.history=[];}catch(e){console.warn('저장 불러오기 실패',e)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('저장 공간을 확인해 주세요')}}
let toastTimer;function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2300)}
function choose(arr){return arr[Math.floor(Math.random()*arr.length)]}
function wish(){state.fates--;state.total++;state.pity5++;state.pity4++;
const chance5=state.pity5>=90?1:state.pity5>=74?Math.min(1,.006+(state.pity5-73)*.06):.006;
let rarity=Math.random()<chance5?5:state.pity4>=10||Math.random()<.051?4:3;
let c=null;if(rarity===5){const featured=characters.find(x=>x.featured);const win=state.guaranteed||Math.random()<.5;c=win?featured:choose(characters.filter(x=>x.stars===5&&!x.featured));state.guaranteed=!win;state.pity5=0;state.pity4=0}
else if(rarity===4){c=choose(characters.filter(x=>x.stars===4));state.pity4=0}
if(c){state.collection[c.id]=(state.collection[c.id]||0)+1;state.history.unshift({id:c.id,rarity,time:Date.now()})}else state.history.unshift({id:'weapon',rarity:3,time:Date.now()});
state.history=state.history.slice(0,100);return c?{name:c.name,rarity,count:state.collection[c.id]}:{name:'3성 무기',rarity:3,count:0}}
function drawResult(items){const best=items.filter(x=>x.rarity===5);const fours=items.filter(x=>x.rarity===4);$('result').innerHTML='';const wrap=document.createElement('div');const heading=document.createElement('strong');heading.className=best.length?'five':fours.length?'four':'';heading.textContent=best.length?'★★★★★ 5성 등장!':fours.length?'★★★★ 4성 획득!':'기원 결과';wrap.append(heading);const p=document.createElement('p');p.textContent=items.map(x=>x.name+(x.count>1?' (중복 '+x.count+'회)':'')).join(' · ');wrap.append(p);$('result').append(wrap)}
function render(){ $('gems').textContent=state.gems.toLocaleString();$('fates').textContent=state.fates.toLocaleString();$('energy').textContent=state.energy;$('power').textContent=state.power;$('fill').style.width=state.energy+'%';$('pity5').textContent=state.pity5;$('pity4').textContent=state.pity4;$('guarantee').textContent=state.guaranteed?'다음 5성 픽업 확정':'픽업 50:50';$('total').textContent=state.total;$('fivecount').textContent=state.history.filter(x=>x.rarity===5).length+'+';const owned=characters.filter(c=>state.collection[c.id]>0).length;$('dexcount').textContent=owned+'/'+characters.length;$('exchange').disabled=state.gems<160;$('wish1').disabled=state.fates<1;$('wish10').disabled=state.fates<10;
$('dex').replaceChildren();characters.filter(c=>filter==='all'||filter==='owned'&&state.collection[c.id]>0||String(c.stars)===filter).forEach(c=>{const n=state.collection[c.id]||0;const el=document.createElement('div');el.className='char'+(n?'':' locked');const a=document.createElement('div');a.className='stars';a.textContent='★'.repeat(c.stars);const b=document.createElement('strong');b.textContent=n?c.name:'???';const d=document.createElement('div');d.className='muted';d.textContent=c.element+' · '+c.region+' · '+(n?'C'+Math.min(n-1,6)+' · '+n+'회':'미획득');el.append(a,b,d);$('dex').append(el)});
$('shop').replaceChildren();const cost=160*(state.upgrade+1);const line=document.createElement('div');line.className='shoprow';const t=document.createElement('span');t.textContent='클릭 강화 Lv.'+state.upgrade+' (+'+1+'씩)';const btn=document.createElement('button');btn.className='btn';btn.textContent='💎 '+cost;btn.disabled=state.gems<cost;btn.onclick=()=>{if(state.gems<cost)return;state.gems-=cost;state.upgrade++;state.power++;save();render();toast('클릭 강화 완료!')};line.append(t,btn);$('shop').append(line)}
$('tap').onclick=()=>{state.energy+=state.power;while(state.energy>=100){state.energy-=100;state.gems+=160;toast('💎 원석 160개 획득!')}save();render()};
$('exchange').onclick=()=>{if(state.gems<160)return;state.gems-=160;state.fates++;save();render()};
function doWish(n){if(state.fates<n){toast('인연이 부족합니다');return}const items=[];for(let i=0;i<n;i++)items.push(wish());save();render();drawResult(items)}
$('wish1').onclick=()=>doWish(1);$('wish10').onclick=()=>doWish(10);
$('filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='teyvat-clicker-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.version!==VERSION||!data.collection||typeof data.collection!=='object'||!Number.isFinite(data.gems)||!Number.isFinite(data.fates))throw Error('invalid');if(!confirm('현재 저장 데이터를 가져온 데이터로 교체할까요?'))return;localStorage.setItem(KEY,JSON.stringify(data));state=fresh();load();render();toast('저장 데이터를 불러왔습니다')}catch(err){toast('올바른 V1 저장 파일이 아닙니다')}finally{e.target.value=''}};
load();render();setInterval(save,30000);
})();
</script></body></html>
